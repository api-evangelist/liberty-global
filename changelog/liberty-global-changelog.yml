observations:
- >-
  The tag prefix is inconsistent across the metadata service's own history —
  0.1.6 (2022-12-14) is unprefixed, every release from v0.1.7 onward carries a
  v. A consumer pinning by tag has to handle both forms.
- >-
  The Helm chart index for the bundle service lists four chart versions
  (0.15.0-0.16.3) all created on the same day, 2023-10-13, even though the
  corresponding releases span June to October 2023 — the chart repository was
  republished in one pass rather than continuously.
- >-
  Nothing has been released in any of the three streams since 2023-11-23.
