note: >-
  Liberty Global publishes no narrative changelog — no CHANGELOG.md in any of
  the three component repositories (probed, 404), and no changelog page,
  because there is no developer portal to host one. What exists is a dated,
  machine-readable release record: tagged GitHub releases per component, plus
  Helm chart indexes with created timestamps. That is captured verbatim below.
  The releases carry no published notes body, so no breaking-vs-additive
  classification is asserted — inferring one would be fabrication.
