name: Liberty Global
kind: company
description: >-
  Liberty Global is a London-headquartered converged connectivity group
  that owns and operates fixed-broadband and mobile networks across Europe, mostly
  through joint ventures rather than under its own brand — Virgin Media O2 in the
  United Kingdom (50/50 with Telefonica), VodafoneZiggo in the Netherlands (50/50
  with Vodafone Group), Telenet in Belgium, and Virgin Media Ireland — serving roughly
  80 million connections over fibre-rich broadband and 5G. It sits in the value chain
  as a network owner and holding company, not as a developer-facing platform. Liberty
  Global has been a GSMA Open Gateway participant since the initiative launched at
  MWC 2023 and announced a Network-as-a-Service framework with AWS in February 2024
  built on CAMARA standard APIs, but its API posture toward developers is partner-gated
  and indirect: there is no first-party developer portal on libertyglobal.com — the
  developer.libertyglobal.com hostname advertised on its own GitHub organisation
  profile does not resolve — and every callable CAMARA network API reaches the market
  through the operating joint ventures (Virgin Media O2's UK KYC Age Verify, KYC
  Tenure and SIM Swap APIs; VodafoneZiggo's four Dutch network APIs) or through the
  operators' shared channels, never from the parent. The only OpenAPI definitions
  Liberty Global itself publishes are the Apache-2.0 RDK App Store service specs in
  its public GitHub organisation.
