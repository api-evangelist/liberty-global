apis:
- aid: liberty-global:appstore-metadata-service-api
  name: AppStore Metadata Service API
  description: The ASMS (AppStore Metadata Service) REST API from Liberty Global
    Technology Services BV — the MAS API in RDK. Manages application metadata and
    maintainer records for the RDK-based set-top box app store, with operations
    over /apps, /maintainers, and per-maintainer application resources. Published
    as an OpenAPI 3.0.0 definition under Apache 2.0 in the LibertyGlobal GitHub
    organisation. It is an open-source component specification for an operator-hosted
    service; no public hosted base URL, signup, or authentication scheme is defined
    in the document.
  humanURL: https://github.com/LibertyGlobal/appstore-metadata-service
  tags:
  - RDK
  - App Store
  - Metadata
  - Set-Top Box
  properties:
  - type: OpenAPI
    url: openapi/liberty-global-appstore-metadata-service-openapi.yml
  - type: Documentation
    url: https://github.com/LibertyGlobal/appstore-metadata-service/blob/master/README.md
  - type: APIReference
    url: https://github.com/LibertyGlobal/appstore-metadata-service/blob/master/appstore-metadata-service/src/main/resources/static/appstore-metadata-service.yaml
  - type: SourceCode
    url: https://github.com/LibertyGlobal/appstore-metadata-service
  - type: Overlay
    url: overlays/liberty-global-appstore-metadata-service-overlay.yaml
- aid: liberty-global:appstore-bundle-service-api
  name: AppStore Bundle Service API
  description: The AppStore Bundle Service API from Liberty Global Technology
    Services BV handles the application bundle generation process by interacting
    with the Bundle Generator and Bundle Cryptor services, exposing a single
    parameterised resource keyed on application id, application version, platform
    name, firmware version, and bundle name. Published as an OpenAPI 3.0.1
    definition under Apache 2.0 in the LibertyGlobal GitHub organisation, for an
    operator-hosted deployment rather than a public endpoint.
  humanURL: https://github.com/LibertyGlobal/appstore-bundle-service
  tags:
  - RDK
  - App Store
  - Bundles
  - Set-Top Box
  properties:
  - type: OpenAPI
    url: openapi/liberty-global-appstore-bundle-service-openapi.yml
  - type: Documentation
    url: https://github.com/LibertyGlobal/appstore-bundle-service/blob/master/README.md
  - type: APIReference
    url: https://github.com/LibertyGlobal/appstore-bundle-service/blob/master/appstore-bundle-service-application/src/main/resources/static/appstore-bundle-service.yaml
  - type: SourceCode
    url: https://github.com/LibertyGlobal/appstore-bundle-service
  - type: Overlay
    url: overlays/liberty-global-appstore-bundle-service-overlay.yaml
- aid: liberty-global:appstore-caching-service-api
  name: AppStore Caching Service API
  description: The AppStore Caching Service API from Liberty Global Technology
    Services BV acts as a caching proxy in front of the AppStore Bundle Service,
    serving generated application bundles addressed by application id, version,
    platform, firmware version, and bundle name. Published as an OpenAPI 3.0.1
    definition under Apache 2.0 in the LibertyGlobal GitHub organisation, for an
    operator-hosted deployment rather than a public endpoint.
  humanURL: https://github.com/LibertyGlobal/appstore-caching-service
  tags:
  - RDK
  - App Store
  - Caching
  - Set-Top Box
  properties:
