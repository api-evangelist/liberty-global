cross_service_flow:
  description: >-
    The three published services form one chain. A set-top box asks the
    Caching Service for a bundle; the Caching Service proxies the Bundle
    Service; the Bundle Service resolves the application against ASMS and
    drives the Bundle Generator and Bundle Cryptor over RabbitMQ. Only the
    first three links are specified in OpenAPI.
  chain:
  - {service: appstore-caching-service, path: '/{appId}/{appVersion}/{platformName}/{firmwareVersion}/{appBundleName}'}
  - {service: appstore-bundle-service, path: '/applications/{appId}/{appVersion}/{platformName}/{firmwareVersion}/{appBundleName}'}
  - {service: appstore-metadata-service, path: '/apps/{applicationId}'}
  - {service: bundle-generator-service, path: 'not specified — AMQP queue bundlegen-service-requests'}
  - {service: bundle-cryptor-service, path: 'not specified — AMQP queue bundlecrypt-service-requests'}
