summary: >-
  Two root entities — Maintainer and Application — plus a bundle artifact that
  is addressed rather than stored. The distinguishing feature of this model is
  that Application is projected into two parallel schema families by audience:
  Stb* (what a set-top box may see) and Maintainer* (what the publishing
  developer may see), each with a list-view Header shape and a
  single-resource Details shape. There is no shared canonical Application
  representation on the wire.
entities:
- name: Maintainer
  schema: Maintainer
  identifier: code
  identifier_note: >-
    A short opaque company code (example "lgi"). Used as the {maintainerCode}
    path segment; maintainers are grouped as companies and may only manage
    applications belonging to their own company.
  fields: [code, name, address, homepage, email]
  update_shape: MaintainerForUpdate
  collection_shape: MaintainerList
  operations: [getMaintainers, createMaintainer, getMaintainer, replaceMaintainer, deleteMaintainer]
- name: Application
  schema: Application
  identifier: id + version
  identifier_note: >-
    Applications are version-addressed. {applicationId} carries an id:version
    form, and version defaults to the literal string "latest" on search. The
    pair, not the id alone, identifies a resource.
  update_shape: ApplicationForUpdate
  projections:
  - {audience: stb, list: StbApplicationHeader, single: StbSingleApplicationHeader, details: StbApplicationDetails, collection: StbApplicationsList, versions: StbVersions}
  - {audience: maintainer, list: MaintainerApplicationHeader, single: MaintainerSingleApplicationHeader, details: MaintainerApplicationDetails, collection: MaintainerApplicationsList, versions: MaintainerVersions}
  operations: [listApplications, getApplicationDetails, listMaintainerApplications, createMaintainerApplication, getMaintainerApplication, replaceMaintainerApplication, deleteMaintainerApplication]
- name: ApplicationHeader
  schema: ApplicationHeader
  role: value object
  fields_note: >-
    id, version, name, description, icon, url, type, category, size, visible,
    encryption, preferred, latest, ociImageUrl, localization[]. The generated
    subset is split out as AppicationHeaderGeneratedAttributes (spelling is the
    provider's).
  update_shape: ApplicationHeaderForUpdate
- name: Requirements
  schema: Requirements
  role: value object
  composed_of: [Dependency, Platform, Hardware, Feature]
- name: Localization
  schema: Localization
  role: value object
  fields: [languageCode, name, description]
- name: ApplicationBundle
  schema: none — binary stream
  identifier: appId + appVersion + platformName + firmwareVersion + appBundleName
  note: >-
    Not a stored resource with a schema. The bundle is addressed by a
    five-segment composite key and returned as a stream; 202 Accepted means it
    is still being generated. Modelled by the AppStore Bundle Service and
    fronted by the AppStore Caching Service.
