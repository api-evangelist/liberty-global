    implementation sits in an operating joint venture: Virgin Media O2 (KYC Age
    Verify, KYC Tenure, SIM Swap, KYC Match announced) and VodafoneZiggo (four
    APIs including SIM Swap and Number Verification). Conformance is held by
    the JVs, not the parent.
