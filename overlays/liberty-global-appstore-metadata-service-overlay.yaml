x-apievangelist:
  generated: '2026-07-25'
  method: generated
  source: >-
    API Evangelist enrichment round 2026-07-25. Captures what this repo learned
    that the published specification does not say. The original Apache-2.0
    document is never mutated.
actions:
- target: $.info
  update:
    x-apievangelist-provider: liberty-global
    x-apievangelist-artifacts:
      authentication: authentication/liberty-global-authentication.yml
      conventions: conventions/liberty-global-conventions.yml
      errors: errors/liberty-global-problem-types.yml
      data-model: data-model/liberty-global-data-model.yml
