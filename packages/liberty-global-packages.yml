summary: >-
  Liberty Global ships no client SDK for any Liberty Global API. What it does
  publish, and what is catalogued below, is the runtime distribution of the
  RDK/DAC AppStore stack whose three OpenAPI definitions are in openapi/:
  container images on Docker Hub under the `daccloud` namespace and Helm charts
  served from libertyglobal.github.io. Those are server distributions — you
  deploy the API with them, you do not call the API with them — so no `SDKs`
  pointer is wired into apis.yml. The `sdk_count` ergonomics signal is
  genuinely absent for this provider.
sdk_count: 0
