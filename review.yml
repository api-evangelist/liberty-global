aid: liberty-global
name: Liberty Global
review:
  question: Does Liberty Global operate a real, first-party, self-serve developer
    portal and publish callable network APIs, or does it reach developers only
    through its operating joint ventures?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: fixed-broadband
findings:
  summary: |
    Liberty Global is a network owner and holding company, not a developer
    platform. There is no first-party developer portal anywhere on
    libertyglobal.com. Every conventional developer hostname probed on
    2026-07-25 failed to resolve (NXDOMAIN): developer.libertyglobal.com,
    developers.libertyglobal.com, docs.libertyglobal.com,
    api.libertyglobal.com, opengateway.libertyglobal.com, and
    developers.opengateway.libertyglobal.com. Every path probed on the
    corporate site returned HTTP 404: /developer, /developers, /api,
    /opengateway. The apex libertyglobal.com does not resolve either; only
    www.libertyglobal.com is served.

    The most telling artifact is a dangling reference the company publishes
    about itself: the LibertyGlobal GitHub organisation profile
    (https://api.github.com/orgs/LibertyGlobal, fetched 2026-07-25, HTTP 200)
    lists "blog": "https://developer.libertyglobal.com" and
    "email": "developers@libertyglobal.com". That developer hostname does not
    resolve. Liberty Global points the world at a developer programme that no
    longer exists — a dead developer programme with a live pointer to it.

    Real specs were nevertheless found. Liberty Global Technology Services BV
    publishes three Apache-2.0 OpenAPI 3.0 definitions in its public GitHub
    organisation for the RDK set-top-box App Store stack. All three were
    fetched verbatim, parse as valid OpenAPI, and are stored in openapi/.
    These are open-source component specifications for operator-hosted
    services — they declare no servers block, no security scheme, and no
    public base URL. They are not a consumable public API product.

    On the sector seam, Liberty Global is a genuine GSMA Open Gateway
    participant but a structurally indirect one. It has been part of the
    initiative since the MWC 2023 launch, and its February 2024
    Network-as-a-Service announcement with AWS explicitly commits to CAMARA
    standard APIs and GSMA Open Gateway standards. But nothing is callable
    from the parent. Every CAMARA API with evidence behind it is exposed by an
    operating joint venture, not by Liberty Global: Virgin Media O2 (50/50
    with Telefonica) commercially launched CAMARA KYC Age Verify and KYC
    Tenure in the UK alongside BT, EE and Vodafone in September 2025, already
    had SIM Swap available, and had KYC Match slated for end-2025;
    VodafoneZiggo (50/50 with Vodafone Group) was described in the AWS
    announcement as already offering four APIs to customers including SIM Swap
    and Number Verification. The UK launch is a joint operator programme, not
    a Liberty Global product.

    Liberty Global does not appear on Aduna's partner roster
    (adunaglobal.com, fetched 2026-07-25) — the operators listed are Airtel,
    AT&T, Deutsche Telekom, KDDI, Orange, Reliance Jio, Singtel, T-Mobile,
    Telefonica, Telstra, Verizon and Vodafone, plus Ericsson. Its JV parents
    Telefonica and Vodafone are there; Liberty Global itself is not. Reach to
    the aggregation channel, where it exists, is inherited through the JV
    partner rather than held directly.

    Net: this is the sector's carrier pattern in its purest form. A real
    network, a real standards commitment, a real press-release record — and no
    front door. A developer cannot obtain a credential, read a reference, or
    call an endpoint from Liberty Global. They must go to Virgin Media O2,
    VodafoneZiggo, or the operators' shared UK channel.
  developerPortal:
    url: ''
    confirmed: false
    gated: true
    verdict: >-
      No developer portal exists. Not a login wall and not a marketing page —
      nothing is served at any developer hostname or path. The one advertised
      developer URL (developer.libertyglobal.com, on the company's own GitHub
      org profile) is NXDOMAIN.
