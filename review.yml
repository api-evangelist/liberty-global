  camara:
    posture: >-
      GSMA Open Gateway participant since MWC 2023 with a real CAMARA
      commitment, but nothing callable from Liberty Global itself — every
      CAMARA API ships through the operating joint ventures (Virgin Media O2,
      VodafoneZiggo), not the parent.
    firstPartyCamaraEndpoint: false
    pressReleaseOnly: false
    pressReleaseOnlyNote: >-
      This is more than a press release, but less than an implementation at
      the parent level. Real commercial CAMARA APIs exist inside the group and
      are being sold; none of them are exposed, documented, or credentialed by
      Liberty Global. The AWS NaaS framework announced 2024-02-21 is a
      framework commitment, and no developer surface from it was found live in
      July 2026.
    apisWithEvidence:
    - name: SIM Swap
      via: Virgin Media O2 (UK) and VodafoneZiggo (NL)
      evidence: >-
        VMO2 stated the SIM Swap API is already available in the UK operator
        launch; the AWS NaaS release cites VodafoneZiggo already offering SIM
        swap among four APIs.
    - name: Number Verification
      via: VodafoneZiggo (NL)
      evidence: >-
        AWS NaaS announcement, 2024-02-21, names "number verify" among the four
        APIs VodafoneZiggo already offers customers.
    - name: KYC Age Verification
      via: Virgin Media O2 (UK)
      evidence: >-
        UK commercial launch with BT, EE and Vodafone, announced 2025-09-23 on
        libertyglobal.com and by the GSMA; CAMARA-standardised, driven by the UK
        Online Safety Act.
    - name: KYC Tenure
      via: Virgin Media O2 (UK)
      evidence: Same UK commercial launch, 2025-09-23; available now.
    - name: KYC Match
      via: Virgin Media O2 (UK)
      evidence: >-
        Same announcement — described as forthcoming with fuzzy-logic matching
        before end of 2025. Announced, not confirmed callable at review date.
    notFound:
    - Device Location / Location Verification
    - Device Status / Reachability
    - Quality on Demand (QoD)
    - Carrier Billing
    - Anti-fraud / Scam Signal
    - Device Swap
    - Population Density
  openGateway:
    member: true
    since: '2023'
    note: >-
      Liberty Global states it has been part of the GSMA Open Gateway
      initiative since its launch at MWC 2023. Participation is exercised
      through Virgin Media O2 and VodafoneZiggo. No Open Gateway portal exists
      on any libertyglobal.com hostname.
  aduna:
    partner: false
    note: >-
      Liberty Global, Virgin Media O2, VodafoneZiggo and Telenet are absent
      from the operator roster published at adunaglobal.com (fetched
      2026-07-25). JV parents Telefonica and Vodafone are listed. Any Aduna
      reach is inherited through the JV partner, not held directly.
  tmForum:
    conformanceFound: false
    note: >-
      No TM Forum Open API conformance certification (TMF620, TMF622, TMF641
      or otherwise) was found published by Liberty Global during this review.
      Absence of evidence, not evidence of absence — BSS/OSS conformance is
      commonly held privately by group operators.
  threeGPP:
    nefOrScefSurface: false
    networkSlicingApi: false
    edgeMecApi: false
    note: >-
      No public NEF or SCEF surface, no network-slicing API, and no edge/MEC
      API were found. The AWS NaaS framework is the nearest adjacent
      commitment and exposes nothing publicly.
  auth:
    model: none published
    ciba: false
    cibaNote: >-
      CIBA (Client-Initiated Backchannel Authentication) does not appear
      anywhere in Liberty Global's published material or in the three harvested
      specs. The harvested App Store specs declare no securitySchemes at all.
      Any OIDC/CIBA flows for the group's CAMARA APIs live behind the JV
      operators' onboarding, which is not publicly reachable.
    wellKnownProbed:
    - url: https://www.libertyglobal.com/.well-known/openid-configuration
      status: 404
  webhooks:
    published: false
    asyncapi: false
    note: No webhook or event catalog is published; no AsyncAPI documents found.
  graphql:
    found: false
  grpc:
    found: false
  postman:
    publicWorkspace: false
    note: No first-party public Postman workspace found.
  sdks:
    firstPartyPackages: []
    note: >-
      No first-party API client SDKs on npm, PyPI, Maven Central or NuGet for a
      Liberty Global API. The GitHub organisation ships platform engineering —
      Flutter engine forks, WPEWebKit, Thunder/RDK services, Yocto layers — plus
      archived legacy SDKs (Guide-SDK for a "Kraken API", Sequoia/Piksel Palette
      client SDKs), which are not current API products.
  channelToDevelopers: >-
    Indirect. Developers reach Liberty Global's network capabilities only
    through the operating joint ventures — Virgin Media O2 in the UK,
    VodafoneZiggo in the Netherlands — or through the UK operators' shared
    Open Gateway channel. The parent publishes no credentials, no reference,
    and no endpoint.
  transports:
  - protocol: REST
    scheme: https
    documented: true
    note: >-
      Only in the three Apache-2.0 RDK App Store OpenAPI documents on GitHub.
      No servers block, no hosted public base URL.
  - protocol: GraphQL
    documented: false
  - protocol: gRPC
    documented: false
  - protocol: WebSocket
    scheme: wss
    documented: false
  - protocol: Webhooks
    documented: false
